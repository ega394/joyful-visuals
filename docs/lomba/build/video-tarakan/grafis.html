<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<title>Prokopim Hibot — video Lomba Inovasi Daerah Kota Tarakan 2026</title>
<style>
@font-face { font-family: "PJS"; src: url("aset/PlusJakartaSans-Variable.woff2") format("woff2"); font-weight: 200 800; }
:root { --navy:#0A1628; --navy2:#10203A; --navy3:#172B4A; --garis:#2A3B57; --emas:#F2C14E; --emas2:#C9A84C; --ungu:#7C6CF2;
        --biru:#4C8DF6; --hijau:#34C38F; --merah:#F05A5A; --abu:#A7B6CC; --abu2:#6B7F9E; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: "PJS", sans-serif; color: #fff; }
#dunia { position: absolute; inset: 0; overflow: hidden; background: var(--navy); }
.adegan { position: absolute; inset: 0; overflow: hidden; display: none;
          background: radial-gradient(1500px 900px at 72% 12%, #172c4f 0%, var(--navy) 60%); }
.abs { position: absolute; }
.b { font-weight: 800; letter-spacing: -0.02em; }
.tengah { left: 0; right: 0; text-align: center; }
.kartu { position: absolute; background: rgba(16,32,58,.94); border: 1.5px solid var(--garis); border-radius: 28px; box-shadow: 0 30px 70px rgba(0,0,0,.35); }
.pil { position: absolute; display: inline-flex; align-items: center; gap: 12px; padding: 12px 24px; border-radius: 999px; font-weight: 700; font-size: 26px; white-space: nowrap; }
.pil.emas { background: rgba(242,193,78,.14); border: 1.5px solid rgba(242,193,78,.55); color: var(--emas); }
.pil.hijau { background: rgba(52,195,143,.16); border: 1.5px solid rgba(52,195,143,.6); color: #7FE3BD; }
.pil.merah { background: rgba(240,90,90,.16); border: 1.5px solid rgba(240,90,90,.6); color: #FFA3A3; }
.pil.putih { background: #fff; color: var(--navy); }
.pil.ungu { background: rgba(124,108,242,.2); border: 1.5px solid rgba(124,108,242,.7); color: #C9C1FF; }
.ik { display: inline-flex; }
.ik svg { display: block; }
.kertas { position: absolute; background: #fff; padding: 10px; border-radius: 6px; box-shadow: 0 30px 60px rgba(0,0,0,.6); }
.kertas img { display: block; width: 100%; }
.laptop { position: absolute; }
.laptop .layar { position: absolute; left: 0; top: 0; right: 0; bottom: 26px; border-radius: 20px; background: #05080f; border: 14px solid #0c121c;
                 box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 2px #26344c; overflow: hidden; }
.laptop .layar img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.laptop .dasar { position: absolute; left: -5%; right: -5%; bottom: 0; height: 26px; border-radius: 0 0 26px 26px; background: linear-gradient(#34445e, #151e2e); }
.ponsel { position: absolute; border-radius: 50px; background: #05080f; border: 12px solid #0c121c; box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 2px #2b3b57; overflow: hidden; }
.ponsel img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.bingkaiFoto { position: absolute; border-radius: 26px; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.08); }
.bingkaiFoto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.penuh { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.gelapKiri { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,22,40,.96) 0%, rgba(10,22,40,.82) 42%, rgba(10,22,40,.1) 75%); }
.angka { font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.label { font-size: 34px; font-weight: 700; color: var(--abu); }
.obrol { position: absolute; border-radius: 46px; background: #0c1621; border: 12px solid #0c121c; box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 2px #2b3b57; overflow: hidden; }
.obrol .kepala { height: 92px; background: #16263a; display: flex; align-items: center; gap: 14px; padding: 0 20px; }
.obrol .ava { width: 52px; height: 52px; border-radius: 26px; background: linear-gradient(135deg, #3b6fd8, #7c6cf2); display: flex; align-items: center; justify-content: center; }
.obrol .gel { position: absolute; max-width: 78%; padding: 14px 16px; border-radius: 18px; font-size: 21px; line-height: 1.35; }
.obrol .kiri { left: 16px; background: #1e2c3d; border-top-left-radius: 4px; }
.obrol .kanan { right: 16px; background: #1d4d3a; border-top-right-radius: 4px; }
.ubin { position: absolute; display: flex; align-items: center; gap: 14px; padding: 0 18px; border-radius: 18px; background: rgba(23,43,74,.95); border: 1.5px solid #2f456a; font-size: 22px; font-weight: 700; line-height: 1.2; }
#atas { position: absolute; inset: 0; pointer-events: none; }
#chip { position: absolute; left: 64px; top: 40px; display: flex; align-items: center; gap: 18px; padding: 12px 24px 12px 20px; border-radius: 999px;
        background: rgba(10,22,40,.72); border: 1.5px solid rgba(242,193,78,.45); }
#chip .nama { color: var(--emas); font-weight: 800; font-size: 22px; letter-spacing: 3px; }
#chip .titik { display: flex; gap: 8px; }
#chip .titik i { width: 10px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.22); display: block; }
#chip .titik i.on { background: var(--emas); width: 26px; }
#logo { position: absolute; right: 60px; top: 30px; display: flex; align-items: center; gap: 16px; padding: 10px 22px 10px 12px; border-radius: 20px; background: rgba(10,22,40,.72); border: 1.5px solid rgba(255,255,255,.1); }
#logo img { height: 66px; }
#logo .t1 { font-weight: 800; font-size: 20px; letter-spacing: 2.5px; }
#logo .t2 { font-weight: 600; font-size: 16px; color: var(--abu); letter-spacing: 1px; margin-top: 2px; }
</style></head>
<body>
<div id="dunia"></div>
<div id="atas">
  <div id="chip"><span class="nama"></span><span class="titik"></span></div>
  <div id="logo"><img src="aset/tarakan.png"><div><div class="t1">PEMERINTAH KOTA TARAKAN</div><div class="t2">Bagian Protokol dan Komunikasi Pimpinan</div></div></div>
</div>
<script src="data.js"></script>
<script>
const L = window.LINI, FPS = L.fps, IKON = window.IKON, JUMLAH = window.JUMLAH || {};
const dunia = document.getElementById("dunia");

// ---------- alat bantu ----------
const kl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, d) => kl((t - a) / d);
const halus = (x) => x * x * (3 - 2 * x);
const keluar3 = (x) => 1 - Math.pow(1 - x, 3);
const masukKeluar = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const pegas = (x) => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : x >= 1 ? 1 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const e = (t, a, d = 0.6, f = keluar3) => f(lin(t, a, d));
const campur = (a, b, k) => a + (b - a) * k;
const gaya = (n, o) => Object.assign(n.style, o);
const buat = (induk, html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); const n = d.firstChild; induk.appendChild(n); return n; };
const angka = (v, dp = 0) => v.toLocaleString("id-ID", { minimumFractionDigits: dp, maximumFractionDigits: dp });
function ik(n, uk = 40, warna = "currentColor", tebal = 2) {
  const s = IKON[n] || IKON["circle-help"];
  return `<span class="ik" style="color:${warna}">` + s.replace(/width="24"/, `width="${uk}"`).replace(/height="24"/, `height="${uk}"`).replace(/stroke-width="2"/, `stroke-width="${tebal}"`) + "</span>";
}
// muncul: pudar + geser naik + skala; hilang pada `sampai` (opsional)
function muncul(n, t, a, d = 0.5, dy = 26, sampai = null, sk = 1, f = keluar3) {
  let k = f(lin(t, a, d));
  if (sampai !== null) k *= 1 - keluar3(lin(t, sampai, 0.35));
  n.style.opacity = k;
  n.style.transform = `translateY(${(1 - k) * dy}px) scale(${sk + (1 - sk) * k})`;
  return k;
}
function jendela(n, t, a, b, d = 0.35) {   // tampak antara a..b, pudar masuk/keluar
  const k = lin(t, a, d) * (1 - lin(t, b, d));
  n.style.opacity = k; n.style.visibility = k > 0.001 ? "visible" : "hidden";
  return k;
}
const MENUNGGU = [];
class Rekaman {               // urutan bingkai JPG hasil siapkan.py
  constructor(img, id) { this.img = img; this.id = id; this.n = -1; this.maks = Math.max(0, (JUMLAH[id] || 1) - 1); }
  bingkai(n) {
    n = Math.max(0, Math.min(this.maks, Math.floor(n)));
    if (n !== this.n) { this.n = n; this.img.src = `bingkai/${this.id}/${String(n + 1).padStart(5, "0")}.jpg`; MENUNGGU.push(this.img.decode().catch(() => {})); }
  }
  // petakan rentang sumber [s0, s1] (detik) ke rentang tayang [t0, t1]
  petakan(t, t0, t1, s0 = 0, s1 = null) {
    if (s1 === null) s1 = this.maks / FPS;
    this.bingkai((s0 + (s1 - s0) * kl((t - t0) / (t1 - t0))) * FPS);
  }
}
function rekaman(induk, id, kelas, css) {
  const img = buat(induk, `<img class="${kelas || "penuh"}" style="${css || ""}">`);
  return new Rekaman(img, id);
}
function ponsel(induk, x, y, w, h, isi = "") {
  return buat(induk, `<div class="ponsel" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${isi}</div>`);
}
function laptop(induk, x, y, w, h) {
  return buat(induk, `<div class="laptop" style="left:${x}px;top:${y}px;width:${w}px;height:${h + 26}px"><div class="layar"></div><div class="dasar"></div></div>`);
}
function bantu(a) {
  const K = a.kalimat || [];
  return Object.assign({}, a, {
    k: (i) => (K[i] ? K[i].awal : 0),
    e: (i) => (K[i] ? K[i].akhir : 0),
    // perkiraan saat sebuah kata diucapkan: sebanding letaknya dalam teks ucapan
    w: (i, kata, urut = 0) => {
      const s = K[i]; if (!s) return 0;
      const u = (s.ucap || s.takarir).toLowerCase(); let idx = -1, dari = 0;
      for (let j = 0; j <= urut; j++) { idx = u.indexOf(kata.toLowerCase(), dari); if (idx < 0) break; dari = idx + 1; }
      return idx < 0 ? s.awal : s.awal + (s.akhir - s.awal) * idx / u.length;
    },
  });
}
// angka acak tetap (agar tiap render sama)
let benih = 7; const acak = () => ((benih = (benih * 16807) % 2147483647) / 2147483647);

const SC = {};

// =====================================================================
// 1. PEMBUKA — satu lembar tidak ikut terfoto
// =====================================================================
SC.pembuka = (R, A) => {
  R.style.background = "radial-gradient(1300px 820px at 50% 45%, #10203a 0%, #050a14 72%)";
  const tgl = buat(R, `<div class="abs b tengah" style="top:380px;font-size:150px;letter-spacing:12px"></div>`);
  const kursor = buat(R, `<div class="abs" style="top:400px;width:10px;height:140px;background:var(--emas)"></div>`);
  const lokasi = buat(R, `<div class="abs tengah" style="top:585px;font-size:30px;font-weight:700;color:var(--abu);letter-spacing:7px">SEKRETARIAT DAERAH KOTA TARAKAN</div>`);
  const stempel = buat(R, `<div class="pil emas" style="left:110px;top:150px;font-size:24px">${ik("calendar", 26)}Januari 2026</div>`);
  const kA = buat(R, `<div class="kertas" style="left:110px;top:240px;width:700px;transform-origin:50% 50%"><img src="aset/lembar-sampai.jpg"></div>`);
  const kB = buat(R, `<div class="kertas" style="left:190px;top:626px;width:700px"><img src="aset/lembar-tertinggal.jpg"></div>`);
  const lA = buat(R, `<div class="pil putih" style="left:140px;top:206px;font-size:20px;padding:8px 16px">RENCANA KEGIATAN</div>`);
  const lB = buat(R, `<div class="pil putih" style="left:220px;top:592px;font-size:20px;padding:8px 16px">RENCANA AUDIENSI</div>`);
  const garisB = buat(R, `<div class="abs" style="left:176px;top:612px;width:728px;height:272px;border:5px dashed var(--merah);border-radius:14px"></div>`);
  const tandaB = buat(R, `<div class="pil merah" style="left:925px;top:720px;font-size:21px;padding:10px 18px">${ik("x", 22)}TIDAK IKUT<br>TERFOTO</div>`);
  const bidik = buat(R, `<div class="abs" style="left:96px;top:226px;width:728px;height:398px">
     ${["left:0;top:0;border-left:6px solid #fff;border-top:6px solid #fff", "right:0;top:0;border-right:6px solid #fff;border-top:6px solid #fff",
        "left:0;bottom:0;border-left:6px solid #fff;border-bottom:6px solid #fff", "right:0;bottom:0;border-right:6px solid #fff;border-bottom:6px solid #fff"]
       .map((s) => `<div class="abs" style="width:70px;height:70px;${s}"></div>`).join("")}</div>`);
  const hp = buat(R, `<div class="obrol" style="left:1240px;top:150px;width:420px;height:760px">
     <div class="kepala"><div class="ava">${ik("users", 28, "#fff")}</div><div><div style="font-weight:800;font-size:22px">Grup Koordinasi Agenda</div><div style="font-size:17px;color:var(--abu)">14 anggota</div></div></div>
     <div class="gel kiri" style="top:120px;opacity:0" id="m1"><b style="color:#7FB2FF;font-size:17px">Ajudan</b><br>Berkas disposisi agenda, mohon ditindaklanjuti.</div>
     <div class="gel kanan" style="top:250px;width:300px;padding:8px;opacity:0" id="m2"><img src="aset/lembar-sampai.jpg" style="width:100%;border-radius:10px;display:block"><div style="font-size:16px;text-align:right;color:#9fd5bd;margin-top:6px">16.31 ✓✓</div></div>
     <div class="gel kiri" style="top:470px;opacity:0" id="m3"><b style="color:#FFB27F;font-size:17px">Staf Protokol</b><br>Siap, ditindaklanjuti.</div></div>`);
  const m1 = hp.querySelector("#m1"), m2 = hp.querySelector("#m2"), m3 = hp.querySelector("#m3");
  const terbang = buat(R, `<div class="abs" style="left:120px;top:250px;width:680px;opacity:0"><img src="aset/lembar-sampai.jpg" style="width:100%;display:block;border-radius:8px"></div>`);
  const kilat = buat(R, `<div class="abs" style="inset:0;background:#fff;opacity:0"></div>`);
  const cap = buat(R, `<div class="abs b" style="left:215px;top:700px;font-size:62px;color:var(--merah);letter-spacing:4px;opacity:0;border:7px solid var(--merah);background:rgba(10,22,40,.82);padding:4px 26px;border-radius:14px;white-space:nowrap">TIDAK PERNAH SAMPAI</div>`);
  const ket = buat(R, `<div class="pil merah" style="left:220px;top:592px;font-size:20px;padding:8px 16px;opacity:0">RENCANA AUDIENSI · untuk Senin, 5 Januari 2026</div>`);
  const b1 = buat(R, `<div class="abs b tengah" style="top:380px;font-size:88px;opacity:0">Tidak ada yang lalai…</div>`);
  const b2 = buat(R, `<div class="abs b tengah" style="top:510px;font-size:88px;color:var(--emas);opacity:0">…tapi juga tidak ada yang tahu.</div>`);
  const hitam = buat(R, `<div class="abs" style="inset:0;background:#000;opacity:0"></div>`);
  const TEKS = "JANUARI 2026";
  const tTerfoto = A.w(1, "terfoto"), tFoto = tTerfoto - 1.1, tGrup = A.w(1, "grup");
  return (t) => {
    const n = Math.floor(kl((t - 0.8) / 0.095, 0, TEKS.length));
    tgl.textContent = TEKS.slice(0, n);
    const lebar = tgl.textContent.length * 104;
    gaya(kursor, { left: (960 + lebar / 2 + 10) + "px", opacity: (t < 3.4 && Math.floor(t * 2.4) % 2 === 0) || (t > 0.8 && t < 2.1) ? 1 : 0 });
    const besar = 1 - lin(t, 3.5, 0.4);
    tgl.style.opacity = besar; lokasi.style.opacity = e(t, 2.0, 0.6) * besar;
    muncul(stempel, t, 3.8, 0.5, 10, 12.9);
    // dua lembar di meja
    muncul(kA, t, 3.9, 0.7, 50, 12.9); muncul(lA, t, 4.3, 0.4, 10, 12.9);
    const pergi = e(t, A.k(2) + 0.1, 1.6, masukKeluar);
    const kb = muncul(kB, t, 4.2, 0.7, 50);
    kB.style.opacity = kb * (1 - 0.6 * pergi) * (1 - lin(t, 12.9, 0.35));
    kB.style.transform = `translateY(${(1 - kb) * 50}px) rotate(${2 - 1 * pergi}deg) scale(${1 - 0.04 * pergi})`;
    kB.style.filter = `grayscale(${kl(pergi * 1.3)}) brightness(${1 - 0.45 * pergi}) blur(${1.5 * pergi}px)`;
    lB.style.opacity = e(t, 4.6, 0.4) * (1 - lin(t, A.k(2) + 0.9, 0.3)); kA.style.transform += " rotate(-2.5deg)";
    // bidik & jepret lembar pertama
    jendela(bidik, t, tFoto - 0.8, tFoto + 0.15, 0.25);
    kilat.style.opacity = 0.75 * Math.max(0, 1 - Math.abs(t - tFoto) * 5);
    const tb = e(t, tFoto + 0.05, 0.75, masukKeluar);
    gaya(terbang, { opacity: t > tFoto && tb < 1 ? 1 : 0, transform: `translate(${tb * 1210}px, ${tb * 30}px) scale(${1 - 0.62 * tb})`, transformOrigin: "0 0" });
    muncul(hp, t, 3.95, 0.7, 40, 12.9);
    muncul(m1, t, 4.5, 0.4, 12); muncul(m2, t, tFoto + 0.75, 0.3, 10); muncul(m3, t, tGrup + 0.3, 0.4, 12);
    // lembar kedua: tidak ikut terfoto
    jendela(garisB, t, tTerfoto, A.k(2) + 0.2, 0.3);
    jendela(tandaB, t, tTerfoto + 0.2, A.k(2) + 0.2, 0.3);
    muncul(cap, t, A.k(2) + 0.7, 0.35, 0, 12.9, 1.6, pegas); cap.style.transform += " rotate(-5deg)";
    muncul(ket, t, A.k(2) + 1.0, 0.4, 8, 12.9);
    muncul(b1, t, A.k(3) - 0.05, 0.6, 20); muncul(b2, t, A.k(4) - 0.05, 0.7, 20);
    hitam.style.opacity = lin(t, A.lama - 1.1, 1.0);
  };
};

// =====================================================================
// 2. JUDUL
// =====================================================================
SC.judul = (R, A) => {
  R.style.background = "radial-gradient(1100px 700px at 50% 42%, #2a2366 0%, #0d1736 55%, #070d1c 100%)";
  const cahaya = buat(R, `<div class="abs" style="left:660px;top:120px;width:600px;height:600px;border-radius:300px;background:radial-gradient(circle, rgba(124,108,242,.55), rgba(124,108,242,0) 70%)"></div>`);
  const logo = buat(R, `<img class="abs" src="aset/hibot.png" style="left:840px;top:150px;width:240px;border-radius:52px;box-shadow:0 30px 80px rgba(0,0,0,.5)">`);
  const nama = buat(R, `<div class="abs b tengah" style="top:440px;font-size:128px;letter-spacing:-2px">Prokopim Hibot</div>`);
  const kilau = buat(R, `<div class="abs" style="top:430px;height:170px;width:260px;background:linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.35), rgba(255,255,255,0));mix-blend-mode:overlay"></div>`);
  const sub = buat(R, `<div class="abs tengah" style="top:620px;font-size:40px;font-weight:600;color:#D7DDF0">Superapp Pelayanan Keprotokolan dan Komunikasi Pimpinan</div>`);
  const garis = buat(R, `<div class="abs" style="left:860px;top:705px;width:200px;height:4px;border-radius:2px;background:var(--emas)"></div>`);
  const kota = buat(R, `<div class="abs tengah" style="top:740px;font-size:28px;font-weight:700;color:var(--emas);letter-spacing:4px">PEMERINTAH KOTA TARAKAN · LOMBA INOVASI DAERAH 2026</div>`);
  return (t) => {
    const k = e(t, 0.05, 0.7, pegas);
    gaya(logo, { opacity: lin(t, 0.05, 0.25), transform: `scale(${0.4 + 0.6 * k}) rotate(${(1 - k) * -12}deg)` });
    cahaya.style.opacity = 0.6 + 0.4 * Math.sin(t * 2.2); cahaya.style.transform = `scale(${0.8 + 0.25 * e(t, 0, 1.2)})`;
    muncul(nama, t, 0.35, 0.6, 30); gaya(kilau, { left: (520 + 900 * lin(t, 0.9, 0.9)) + "px", opacity: lin(t, 0.9, 0.1) * (1 - lin(t, 1.7, 0.1)) });
    muncul(sub, t, 0.65, 0.6, 20); garis.style.transform = `scaleX(${e(t, 0.9, 0.6)})`; muncul(kota, t, 1.05, 0.6, 16);
    R.style.opacity = 1 - lin(t, A.lama - 0.35, 0.35) * 0.0;
  };
};

// =====================================================================
// 3. DULU — serba manual
// =====================================================================
SC.dulu = (R, A) => {
  // P0: 91 kegiatan per bulan
  const p0 = buat(R, `<div class="abs" style="inset:0"></div>`);
  const r0 = rekaman(p0, "n1345", "penuh", "filter:blur(7px) brightness(.32) saturate(.7);transform:scale(1.06)");
  const n91 = buat(p0, `<div class="abs angka" style="left:120px;top:230px;font-size:300px;line-height:1;color:var(--emas)">0</div>`);

SC.akar = (R, A) => {
  const judul = buat(R, `<div class="abs b tengah" style="top:150px;font-size:64px">Data <span style="color:var(--merah)">tercerai-berai</span></div>`);
  const judul2 = buat(R, `<div class="abs b tengah" style="top:150px;font-size:54px;opacity:0">Tidak ada <span style="color:var(--emas)">satu sumber</span> yang dipercaya semua pihak</div>`);
  const judul3 = buat(R, `<div class="abs b tengah" style="top:140px;font-size:72px;opacity:0">Jawabannya harus <span style="color:var(--emas)">satu</span>.</div>`);
  const POS = [[250, 300], [1370, 300], [170, 600], [1450, 600], [810, 690]];
  const NAMA = [["file-text", "Kertas", "kertas"], ["sheet", "Spreadsheet", "spredsit"], ["messages-square", "Grup percakapan", "grup"], ["presentation", "Papan tulis", "papan"], ["phone", "Telepon", "telepon"]];
  const svg = buat(R, `<svg class="abs" style="left:0;top:0" width="1920" height="1080"></svg>`);
  const PASANG = [[0, 1], [1, 3], [3, 4], [4, 2], [2, 0], [0, 3], [1, 2]];
  const garis = PASANG.map(([a, b]) => { const g = document.createElementNS("http://www.w3.org/2000/svg", "line"); g.setAttribute("stroke", "#F05A5A"); g.setAttribute("stroke-width", "4"); g.setAttribute("stroke-dasharray", "14 14"); svg.appendChild(g); return [g, a, b]; });
  const kartu = NAMA.map(([i, n], j) => buat(R, `<div class="kartu" style="left:${POS[j][0]}px;top:${POS[j][1]}px;width:300px;height:150px;display:flex;align-items:center;gap:20px;padding:0 28px">${ik(i, 64, "#fff", 1.6)}<div class="b" style="font-size:30px;line-height:1.15">${n}</div></div>`));
  const bulat = buat(R, `<div class="abs" style="left:830px;top:340px;width:260px;height:260px"><div class="cincin" style="position:absolute;inset:0;border-radius:130px;border:6px dashed rgba(240,90,90,.8)"></div><div class="b tanda" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:160px;color:var(--merah)">?</div></div>`);
  const tanda = bulat.querySelector(".tanda"), cincinB = bulat.querySelector(".cincin");
  const cahaya = buat(R, `<div class="abs" style="left:560px;top:70px;width:800px;height:800px;border-radius:400px;background:radial-gradient(circle, rgba(242,193,78,.55), rgba(242,193,78,0) 65%);opacity:0"></div>`);
  const putih = buat(R, `<div class="abs" style="inset:0;background:#fff;opacity:0"></div>`);
  const tKumpul = A.w(2, "jawabannya") - 0.2;
  return (t) => {
    muncul(judul, t, 0.4, 0.5, 16, A.k(1) - 0.2); muncul(judul2, t, A.k(1), 0.5, 16, tKumpul); muncul(judul3, t, tKumpul + 0.6, 0.5, 16);
    const kum = e(t, tKumpul, 0.9, masukKeluar);
    const pusat = [];
    kartu.forEach((n, j) => {
      const a = A.w(0, NAMA[j][2]) - 0.25;
      const k = e(t, a, 0.45, pegas);
      const fx = 10 * Math.sin(t * 1.3 + j * 1.7), fy = 8 * Math.cos(t * 1.1 + j);
      const dx = (810 - POS[j][0]) * kum, dy = (395 - POS[j][1]) * kum;
      n.style.opacity = lin(t, a, 0.15) * (1 - lin(t, tKumpul + 0.75, 0.2));
      n.style.transform = `translate(${fx * (1 - kum) + dx}px, ${fy * (1 - kum) + dy}px) scale(${(0.5 + 0.5 * k) * (1 - 0.6 * kum)}) rotate(${(j % 2 ? 3 : -3) * (1 - kum)}deg)`;
      pusat.push([POS[j][0] + 150 + fx + dx, POS[j][1] + 75 + fy + dy, lin(t, a, 0.15)]);
    });
    garis.forEach(([g, a, b], i) => {
      g.setAttribute("x1", pusat[a][0]); g.setAttribute("y1", pusat[a][1]); g.setAttribute("x2", pusat[b][0]); g.setAttribute("y2", pusat[b][1]);
      const kedip = 0.35 + 0.35 * Math.abs(Math.sin(t * 3 + i));
      g.setAttribute("opacity", Math.min(pusat[a][2], pusat[b][2]) * kedip * (1 - kum));
      g.setAttribute("stroke-dashoffset", -t * 30);
    });
    const kb = muncul(bulat, t, A.k(1) + 0.1, 0.5, 0, null, 0.6, pegas);
    const emas = lin(t, tKumpul + 0.7, 0.3);
    tanda.textContent = emas > 0.5 ? "1" : "?";
    tanda.style.color = emas > 0.5 ? "#F2C14E" : "#F05A5A";
    cincinB.style.borderColor = emas > 0.5 ? "rgba(242,193,78,.95)" : "rgba(240,90,90,.8)";
    cincinB.style.borderStyle = emas > 0.5 ? "solid" : "dashed";
    cincinB.style.transform = `rotate(${emas > 0.5 ? 0 : t * 25}deg)`;
    bulat.style.transform = `scale(${(0.6 + 0.4 * kb) * (1 + 0.15 * e(t, tKumpul + 0.7, 0.4, pegas))})`;
    cahaya.style.opacity = emas * (0.7 + 0.3 * Math.sin(t * 4));
    putih.style.opacity = lin(t, A.lama - 0.6, 0.6);
  };
};

const BAGIAN = ["LATAR BELAKANG", "MASALAH", "SOLUSI", "IMPLEMENTASI", "DAMPAK", "KEBERLANJUTAN"];

const TANPA_CHIP = { pembuka: [0, 99], judul: [0, 99], tutup: [0, 99], walikota: [0, 99] };

function atas(t) {
  let ak = ADEGAN[0]; for (const s of ADEGAN) if (t >= s.a.mulai) ak = s;
  const lok = t - ak.a.mulai;
